<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Resume | Mohamed Yasar</title>
    <meta
      name="description"
      content="High-fidelity professional resume and engineering portfolio of Mohamed Yasar. Optimized for technical evaluation and recruitment indexing."
    />
    <meta name="author" content="Mohamed Yasar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Media Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <!-- UI Dynamic Components -->
    <div id="component-loading-overlay"></div>
    <div id="component-resume-actions"></div>
    <div class="resume-container hidden" id="main-resume">
      <header id="header-module"></header>
      <section id="summary-module"></section>
      <section id="skills-module"></section>
      <section id="experience-module"></section>
      <section id="projects-module"></section>
      <section id="education-module"></section>
      <footer id="footer-module"></footer>
    </div>
    <!-- Allow sections to break across pages for better space utilization -->
    <style>
      section {
        page-break-inside: auto;
      }
    </style>
    <div id="component-more-modal"></div>
    <div id="component-download-overlay"></div>
    <!-- Main Engine -->
    <script src="js/script.js"></script>
  </body>
</html>
